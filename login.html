<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta http-equiv="refresh" content="0; url=https://isp.hdm.co.ke/portal?nasip=$(ip)&router=$(hostname)">
  <title>Connecting…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      background: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      padding: 32px 24px;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 14px; color: #64748b; margin-bottom: 8px; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    a:active { transform: scale(0.98); }
    .error { color: #dc2626; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Redirecting to WiFi portal</h1>
    <p>You will be redirected in a moment.</p>
    <a href="https://isp.hdm.co.ke/portal?nasip=$(ip)&router=$(hostname)" id="manual-link">
      Open portal
    </a>
    <p class="error" id="error-msg" hidden></p>
  </div>

  <script>
    (function () {
      'use strict';

      var PORTAL_BASE = 'https://isp.hdm.co.ke/portal';
      var nasip = '$(ip)';
      var router = '$(hostname)';

      var target = PORTAL_BASE + '?nasip=' + encodeURIComponent(nasip) +
                   '&router=' + encodeURIComponent(router);

      var link = document.getElementById('manual-link');
      if (link) link.href = target;

      var tried = false;
      function attempt() {
        if (tried) return;
        tried = true;
        try {
          window.location.replace(target);
        } catch (e) {
          document.getElementById('error-msg').hidden = false;
          document.getElementById('error-msg').textContent =
            'Could not redirect automatically. Tap "Open portal" above.';
        }
      }

      setTimeout(attempt, 300);
    })();
  </script>

  <noscript>
    <p style="text-align:center;margin-top:16px;">
      <a href="https://isp.hdm.co.ke/portal?nasip=$(ip)">Open WiFi portal</a>
    </p>
  </noscript>
</body>
</html>
